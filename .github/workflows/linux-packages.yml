# Packages the Linux zips of a native-build.yml run as deb/*.deb and rpm/*.rpm, with the deb/ directory's
# APT index, and returns them as this run's artifact. A Jenkins release job starts it through the
# runGithubWorkflow step; the publishLinuxRepositories step then signs them and indexes the RPMs.
# It downloads the zips from the build run, so packaging can run again without rebuilding.
name: Linux Packages
run-name: ${{ inputs.name }} ${{ inputs.version }} Linux packages (${{ inputs.request }})

on:
  workflow_dispatch:
    inputs:
      build-run:
        description: ID of the native-build.yml run whose Linux zips to package
        required: true
      name:
        description: Base name of the zips and name of the packages
        required: true
      version:
        description: Version of the packages
        required: true
      executable:
        description: Name of the executable, installed as /usr/bin/<executable>
        required: true
      description:
        description: Package description
        required: true
      homepage:
        description: Package homepage
        required: true
      license:
        description: Package license, e.g. Apache-2.0
        required: true
      maintainer:
        description: Package maintainer, e.g. Flow Logix, Inc. <noreply@flowlogix.com>
        required: true
      request:
        description: Identifies this run to the Jenkins job that started it
        required: true

permissions:
  contents: read
  # to download the build run's artifacts
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: v2.48.0
      PKG_NAME: ${{ inputs.name }}
      PKG_VERSION: ${{ inputs.version }}
      PKG_EXECUTABLE: ${{ inputs.executable }}
      PKG_DESCRIPTION: ${{ inputs.description }}
      PKG_HOMEPAGE: ${{ inputs.homepage }}
      PKG_LICENSE: ${{ inputs.license }}
      PKG_MAINTAINER: ${{ inputs.maintainer }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}
          pattern: ${{ inputs.name }}-linux-*
          path: zips
          merge-multiple: true
      - name: Install packaging tools
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION"
          sudo apt-get install -y -q apt-utils
      - name: Package
        shell: bash
        run: |
          mkdir -p packages/deb packages/rpm
          for zip in zips/*.zip; do
              case "$zip" in
                  *-linux-x86_64.zip) PKG_ARCH=amd64 ;;
                  *-linux-aarch64.zip) PKG_ARCH=arm64 ;;
                  *) continue ;;
              esac
              rm -rf unpacked && unzip -q "$zip" -d unpacked
              # The config is JSON, which nfpm reads as YAML; jq quotes every value. 493 is mode 0755
              jq -n --arg arch "$PKG_ARCH" \
                  --arg src "unpacked/$PKG_NAME-$PKG_VERSION/bin/$PKG_EXECUTABLE" '{
                  name: env.PKG_NAME, arch: $arch, platform: "linux", version: env.PKG_VERSION,
                  description: env.PKG_DESCRIPTION, homepage: env.PKG_HOMEPAGE,
                  license: env.PKG_LICENSE, maintainer: env.PKG_MAINTAINER,
                  contents: [{src: $src, dst: ("/usr/bin/" + env.PKG_EXECUTABLE), file_info: {mode: 493}}]
              }' > nfpm.yaml
              for packager in deb rpm; do
                  "$(go env GOPATH)/bin/nfpm" package --config nfpm.yaml --packager $packager --target packages/$packager/
              done
          done
      - name: Index the APT repository
        working-directory: packages/deb
        run: |
          apt-ftparchive packages . > Packages
          gzip -9kn Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="Flow Logix" \
              -o APT::FTPArchive::Release::Label="$PKG_NAME" release . > Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-linux-packages
          path: packages/
          if-no-files-found: error
          retention-days: 1
