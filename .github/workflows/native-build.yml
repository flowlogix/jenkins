# Builds native executables of a Maven project on GitHub's runners, one zip per platform.
# A Jenkins release job starts it through the runGithubWorkflow step, waits for it and downloads
# the zips as the run's artifacts; Jenkins then publishes them. This workflow holds no secrets.
#
# Each zip is <name>-<version>-<platform>.zip, holding <name>-<version>/bin/<executable>,
# the layout the util library's jreleaser/native.yaml template expects.
# With the packages input, it also packages the Linux executables as deb/*.deb and rpm/*.rpm, with the
# deb/ directory's APT index. The publishLinuxRepositories step then signs them and indexes the RPMs.
name: Native Build
run-name: ${{ inputs.name }} ${{ inputs.version }} native build (${{ inputs.request }})

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to build, e.g. flowlogix/apps
        required: true
      commit:
        description: Commit to build
        required: true
      version:
        description: Version to release, set into the POMs
        required: true
      project:
        description: Directory of the Maven project that holds the module
        required: true
      module:
        description: Module that builds the native executable
        required: true
      executable:
        description: Name of the executable in bin/
        required: true
      name:
        description: Base name of the zips
        required: true
      build-args:
        description: Maven arguments that build the native executable
        default: -Pnative
      request:
        description: Identifies this run to the Jenkins job that started it
        required: true
      packages:
        description: >-
          To also build .deb and .rpm packages of the Linux executables, their metadata as JSON:
          {"description": ..., "homepage": ..., "license": ..., "maintainer": ...}
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-latest, platform: osx-aarch64 }
          - { os: windows-latest, platform: windows-x86_64, exe: .exe }
    runs-on: ${{ matrix.os }}
    # Inputs reach the shell only as environment variables, never pasted into scripts
    env:
      REPOSITORY: ${{ inputs.repository }}
      VERSION: ${{ inputs.version }}
      PROJECT: ${{ inputs.project }}
      MODULE: ${{ inputs.module }}
      EXECUTABLE: ${{ inputs.executable }}
      NAME: ${{ inputs.name }}
      BUILD_ARGS: ${{ inputs.build-args }}
      # Not PLATFORM: on Windows, Visual Studio's build environment sets Platform=x64
      ZIP_PLATFORM: ${{ matrix.platform }}
      EXE: ${{ matrix.exe }}
    steps:
      - name: Only build this organization's repositories
        shell: bash
        run: |
          case "$REPOSITORY" in
              "$GITHUB_REPOSITORY_OWNER"/*) ;;
              *) echo "Refusing to build $REPOSITORY, outside $GITHUB_REPOSITORY_OWNER"; exit 1 ;;
          esac
      - name: Keep LF line endings on Windows
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.commit }}
      - uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          java-version: '25'
          # Quarkus's own GraalVM distribution, kept current for Quarkus releases
          distribution: mandrel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build native executable
        shell: bash
        run: |
          ./mvnw -B -ntp -C -f "$PROJECT/pom.xml" versions:set \
              -DnewVersion="$VERSION" -DprocessAllModules -DgenerateBackupPoms=false
          # BUILD_ARGS is split into separate arguments on purpose
          ./mvnw -B -ntp -C -f "$PROJECT/pom.xml" -pl "$MODULE" -am verify $BUILD_ARGS
      - name: Package
        shell: bash
        run: |
          D="$NAME-$VERSION"
          mkdir -p "dist/$D/bin"
          cp "$PROJECT/$MODULE"/target/*-runner"$EXE" "dist/$D/bin/$EXECUTABLE$EXE"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
              7z a -bd "$D-$ZIP_PLATFORM.zip" "$D"
          else
              zip -qr "$D-$ZIP_PLATFORM.zip" "$D"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  linux-packages:
    needs: build
    if: inputs.packages != ''
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: v2.48.0
      PKG_NAME: ${{ inputs.name }}
      PKG_VERSION: ${{ inputs.version }}
      PKG_EXECUTABLE: ${{ inputs.executable }}
      PKG_DESCRIPTION: ${{ fromJSON(inputs.packages).description }}
      PKG_HOMEPAGE: ${{ fromJSON(inputs.packages).homepage }}
      PKG_LICENSE: ${{ fromJSON(inputs.packages).license }}
      PKG_MAINTAINER: ${{ fromJSON(inputs.packages).maintainer }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ${{ inputs.name }}-linux-*
          path: zips
          merge-multiple: true
      - name: Install packaging tools
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION"
          sudo apt-get install -y -q apt-utils
      - name: Package
        shell: bash
        run: |
          mkdir -p packages/deb packages/rpm
          for zip in zips/*.zip; do
              case "$zip" in
                  *-linux-x86_64.zip) PKG_ARCH=amd64 ;;
                  *-linux-aarch64.zip) PKG_ARCH=arm64 ;;
                  *) continue ;;
              esac
              rm -rf unpacked && unzip -q "$zip" -d unpacked
              # The config is JSON, which nfpm reads as YAML; jq quotes every value. 493 is mode 0755
              jq -n --arg arch "$PKG_ARCH" \
                  --arg src "unpacked/$PKG_NAME-$PKG_VERSION/bin/$PKG_EXECUTABLE" '{
                  name: env.PKG_NAME, arch: $arch, platform: "linux", version: env.PKG_VERSION,
                  description: env.PKG_DESCRIPTION, homepage: env.PKG_HOMEPAGE,
                  license: env.PKG_LICENSE, maintainer: env.PKG_MAINTAINER,
                  contents: [{src: $src, dst: ("/usr/bin/" + env.PKG_EXECUTABLE), file_info: {mode: 493}}]
              }' > nfpm.yaml
              for packager in deb rpm; do
                  "$(go env GOPATH)/bin/nfpm" package --config nfpm.yaml --packager $packager --target packages/$packager/
              done
          done
      - name: Index the APT repository
        working-directory: packages/deb
        run: |
          apt-ftparchive packages . > Packages
          gzip -9kn Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="Flow Logix" \
              -o APT::FTPArchive::Release::Label="$PKG_NAME" release . > Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-linux-packages
          path: packages/
          if-no-files-found: error
          retention-days: 1
