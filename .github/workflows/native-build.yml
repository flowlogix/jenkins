# Builds native executables of a Maven project on GitHub's runners, one zip per platform.
# A Jenkins release job starts it through the runGithubWorkflow step, waits for it and downloads
# the zips as the run's artifacts; Jenkins then publishes them. This workflow holds no secrets.
#
# Each zip is <name>-<version>-<platform>.zip, holding <name>-<version>/bin/<executable>,
# the layout the util library's jreleaser/native.yaml template expects.
# linux-packages.yml packages the Linux zips of a run of this workflow.
name: Native Build
run-name: ${{ inputs.name }} ${{ inputs.version }} native build (${{ inputs.request }})

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to build, e.g. flowlogix/apps
        required: true
      commit:
        description: Commit to build
        required: true
      version:
        description: Version to release, set into the POMs
        required: true
      project:
        description: Directory of the Maven project that holds the module
        required: true
      module:
        description: Module that builds the native executable
        required: true
      executable:
        description: Name of the executable in bin/
        required: true
      name:
        description: Base name of the zips
        required: true
      build-args:
        description: Maven arguments that build the native executable
        default: -Pnative
      request:
        description: Identifies this run to the Jenkins job that started it
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-latest, platform: osx-aarch64 }
          - { os: windows-latest, platform: windows-x86_64, exe: .exe }
    runs-on: ${{ matrix.os }}
    # Inputs reach the shell only as environment variables, never pasted into scripts
    env:
      REPOSITORY: ${{ inputs.repository }}
      VERSION: ${{ inputs.version }}
      PROJECT: ${{ inputs.project }}
      MODULE: ${{ inputs.module }}
      EXECUTABLE: ${{ inputs.executable }}
      NAME: ${{ inputs.name }}
      BUILD_ARGS: ${{ inputs.build-args }}
      # Not PLATFORM: on Windows, Visual Studio's build environment sets Platform=x64
      ZIP_PLATFORM: ${{ matrix.platform }}
      EXE: ${{ matrix.exe }}
    steps:
      - name: Only build this organization's repositories
        shell: bash
        run: |
          case "$REPOSITORY" in
              "$GITHUB_REPOSITORY_OWNER"/*) ;;
              *) echo "Refusing to build $REPOSITORY, outside $GITHUB_REPOSITORY_OWNER"; exit 1 ;;
          esac
      - name: Keep LF line endings on Windows
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.commit }}
      # The newest GraalVM CE, from SDKMAN, as installed on the Jenkins agents
      - name: Find GraalVM
        id: graalvm
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
              Linux-X64) platform=linuxx64 ;;
              Linux-ARM64) platform=linuxarm64 ;;
              macOS-ARM64) platform=darwinarm64 ;;
              Windows-X64) platform=windowsx64 ;;
          esac
          version=$(curl -fsSL "https://api.sdkman.io/2/candidates/java/$platform/versions/list?installed=" \
              | grep -oE '[0-9][0-9.]*-graalce' | sort -uV | tail -1)
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/graalvm
          key: graalvm-${{ steps.graalvm.outputs.platform }}-${{ steps.graalvm.outputs.version }}
      - name: Install GraalVM ${{ steps.graalvm.outputs.version }}
        shell: bash
        env:
          GRAALVM_PLATFORM: ${{ steps.graalvm.outputs.platform }}
          GRAALVM_VERSION: ${{ steps.graalvm.outputs.version }}
        run: |
          if [ ! -d ~/graalvm ]; then
              mkdir ~/graalvm && cd ~/graalvm
              # Only over https, redirects included. SDKMAN publishes no checksum for these builds
              curl -fsSL --proto '=https' --proto-redir '=https' -o archive \
                  "https://api.sdkman.io/2/broker/download/java/$GRAALVM_VERSION/$GRAALVM_PLATFORM"
              if [ "$RUNNER_OS" = Windows ]; then 7z x -bd archive > /dev/null; else tar -xzf archive; fi
              rm archive
          fi
          home=$(echo ~/graalvm/*)
          [ -d "$home/Contents/Home" ] && home="$home/Contents/Home"
          [ "$RUNNER_OS" = Windows ] && home=$(cygpath -w "$home")
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-
      # native-image on Windows needs Visual Studio's build environment
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Build native executable
        shell: bash
        run: |
          ./mvnw -B -ntp -C -f "$PROJECT/pom.xml" versions:set \
              -DnewVersion="$VERSION" -DprocessAllModules -DgenerateBackupPoms=false
          # BUILD_ARGS is split into separate arguments on purpose
          ./mvnw -B -ntp -C -f "$PROJECT/pom.xml" -pl "$MODULE" -am verify $BUILD_ARGS
      - name: Package
        shell: bash
        run: |
          D="$NAME-$VERSION"
          mkdir -p "dist/$D/bin"
          cp "$PROJECT/$MODULE"/target/*-runner"$EXE" "dist/$D/bin/$EXECUTABLE$EXE"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
              7z a -bd "$D-$ZIP_PLATFORM.zip" "$D"
          else
              zip -qr "$D-$ZIP_PLATFORM.zip" "$D"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1
