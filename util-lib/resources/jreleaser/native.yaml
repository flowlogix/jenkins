# JReleaser config template for a native executable released from Jenkins.
# The release job builds the zips on GitHub with this repository's native-build.yml workflow into
# dist/<name>-<version>-<platform>.zip, uploads them to dl.flowlogix.com, and sets DOWNLOAD_BASE to that
# version's download directory. JReleaser then publishes the release through the channels configured below,
# pointing them at those downloads.
# No GitHub release is created.
# Each @key@ is set by the job through the jreleaserConfig step.
project:
  name: "@name@"
  description: "@description@"
  longDescription: "@longDescription@"
  authors:
    - Flow Logix
  license: "@license@"
  inceptionYear: "@inceptionYear@"
  links:
    homepage: "@homepage@"

release:
  github:
    owner: flowlogix
    name: "@repository@"
    # The job pushes its own tag
    skipTag: true
    # Downloads are hosted on dl.flowlogix.com
    skipRelease: true

distributions:
  "@name@":
    type: BINARY
    executable:
      name: "@executable@"
    # The platforms native-build.yml builds; keep the two lists the same
    artifacts:
      - path: 'dist/{{distributionName}}-{{projectVersion}}-osx-aarch64.zip'
        platform: osx-aarch_64
      - path: 'dist/{{distributionName}}-{{projectVersion}}-linux-aarch64.zip'
        platform: linux-aarch_64
      - path: 'dist/{{distributionName}}-{{projectVersion}}-linux-x86_64.zip'
        platform: linux-x86_64
      - path: 'dist/{{distributionName}}-{{projectVersion}}-windows-x86_64.zip'
        platform: windows-x86_64
    brew:
      active: RELEASE
      # Guards each download by OS and CPU, so the formula installs only on the released platforms
      multiPlatform: true
      downloadUrl: '{{Env.DOWNLOAD_BASE}}/{{artifactFile}}'
      commitAuthor:
        name: flowlogix-bot
        email: noreply@flowlogix.com
      repository:
        owner: flowlogix
        name: homebrew-tap
        tagRepository: false
